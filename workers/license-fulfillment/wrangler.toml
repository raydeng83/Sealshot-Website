name = "license-fulfillment"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Durable order memory: idempotency (a redelivered webhook finds state 'sent'
# and returns without re-issuing) and the retry queue the cron drains.
# Created 2026-08-01 via `wrangler kv namespace create ORDERS`.
# Retain logs. Without this, console.error is visible ONLY in a live
# `wrangler tail`, so every alert this Worker raises — undelivered order,
# unmapped product, unmatched renewal, refund — vanishes at the moment it
# happens. The refund alert on 2026-08-03 was lost exactly this way.
[observability]
enabled = true

[[kv_namespaces]]
binding = "ORDERS"
id = "7c0ac7b21f5e4223b4c585f73c3408a2"

# Retries any order still awaiting delivery. The webhook acknowledges as soon
# as the order is recorded, so this is what actually guarantees delivery —
# see src/fulfill.ts for the backoff.
[triggers]
crons = ["*/5 * * * *"]

# 10 requests per IP per minute on /renew/verify. The endpoint degrades to
# OPEN when this binding is absent, so a misconfiguration can never take
# renewals down — see src/verify.ts.
[[unsafe.bindings]]
name = "VERIFY_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# 5 support-form posts per IP per minute. Lower than the verify limit because a
# human writing a bug report sends one, and because each post costs an email.
# Absent binding degrades OPEN, same as above — a misconfiguration must not take
# the only contact form on the site down.
[[unsafe.bindings]]
name = "FEEDBACK_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

[vars]
# Verified sending identity on mail.seal-shot.com (Resend; DNS added and
# verified 2026-08-10). The subdomain is send-only — its MX exists purely to
# route bounces back to Resend and no mailbox lives there, so buyer replies go
# to REPLY_TO below.
#
# Until 2026-08-10 this was Resend's test sender, onboarding@resend.dev, which
# delivers to the Resend account owner's address and NOTHING else. Every other
# buyer got a silent 403 and no license: three sandbox orders sat `pending`
# with `lastError: email HTTP 403` that day for exactly this reason, having
# been bought with addresses other than the owner's. Putting the test sender
# back reintroduces that failure, and it fails silently.
EMAIL_FROM = "Sealshot <license@mail.seal-shot.com>"
# Polar product id -> license terms, read from `data.product_id` on order.paid.
# Adding a product is a config change, not a deploy. An unmapped id falls back
# to a 12-month NEW purchase: the buyer paid, so they get a working license,
# and `new` mints a fresh one rather than rewriting an existing window.
#
# BOTH environments are mapped, deliberately. The obvious cutover — swap sandbox
# ids for production ones — leaves a window where whichever environment is
# unmapped resolves every purchase to a 12-month new license: a founding buyer
# silently loses 6 months and a renewal mints a SECOND license. Mapping six ids
# costs nothing and removes the window entirely. The only genuinely single-valued
# thing is POLAR_WEBHOOK_SECRET, so that secret is what actually cuts over.
#
#   sandbox                                            production
#   e8d2217b… Sealshot            new,     12 months   5d97bf6b…  — $29.99
#   d5a0e9c3… Sealshot Founding   new,     18 months   aa68d65d…  — $14.99
#   877dd2e8… Sealshot Renewal    renewal, 12 months   a769ede2…  — $17.99
#
# Prices are what the products charge AND what src/config/promos.ts advertises —
# sandbox verified 2026-08-16, production 2026-08-19. The two can drift, since
# Polar decides the charge and neither this file nor the site does, so check it
# rather than believe this comment: `npm run check:prices` in the site repo reads
# each checkout link back from Polar.
PRODUCT_MAP = '{"e8d2217b-25bc-45d0-8f7e-e0783a8d3762":{"kind":"new","months":12},"d5a0e9c3-a6c8-48ab-8010-932b8b1395d8":{"kind":"new","months":18},"877dd2e8-4edc-408c-99b0-d9919eccf6cd":{"kind":"renewal","months":12},"5d97bf6b-2fa8-45c6-9d8b-a30ad2a71062":{"kind":"new","months":12},"aa68d65d-f713-4a6f-86f1-61188b7c567a":{"kind":"new","months":18},"a769ede2-8e48-4c28-b8f3-692524a2bc6c":{"kind":"renewal","months":12}}'
# The From subdomain is send-only, so replies need somewhere real to land.
REPLY_TO = "support@seal-shot.com"
# Where the /support form delivers. Same inbox as REPLY_TO today; separate so a
# feedback firehose can be pointed elsewhere without touching license replies.
FEEDBACK_TO = "support@seal-shot.com"
# Where fulfilment alerts are emailed. Must be an address the current
# EMAIL_FROM can actually reach — now any address, since EMAIL_FROM is a
# verified domain. Under the test sender this had to be the Resend account
# owner's address, or every alert would itself have failed to send, silencing
# precisely the signal this setting exists to raise.
ALERT_EMAIL = "support@seal-shot.com"
# Secrets (SIGNING_KEY_B64, POLAR_WEBHOOK_SECRET, RESEND_API_KEY) set via `wrangler secret put`
