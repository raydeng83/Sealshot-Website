name = "license-fulfillment"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Durable order memory: idempotency (a redelivered webhook finds state 'sent'
# and returns without re-issuing) and the retry queue the cron drains.
# Created 2026-08-01 via `wrangler kv namespace create ORDERS`.
[[kv_namespaces]]
binding = "ORDERS"
id = "7c0ac7b21f5e4223b4c585f73c3408a2"

# Retries any order still awaiting delivery. The webhook acknowledges as soon
# as the order is recorded, so this is what actually guarantees delivery —
# see src/fulfill.ts for the backoff.
[triggers]
crons = ["*/5 * * * *"]

[vars]
EMAIL_FROM = "Sealshot <license@mail.seal-shot.com>"
# The From subdomain is send-only, so replies need somewhere real to land.
REPLY_TO = "support@seal-shot.com"
# Optional: where to email fulfilment alerts. Unset = log-only (wrangler tail /
# Workers Logs). Set it once support@ can receive.
# ALERT_EMAIL = "support@seal-shot.com"
# Secrets (SIGNING_KEY_B64, POLAR_WEBHOOK_SECRET, RESEND_API_KEY) set via `wrangler secret put`
