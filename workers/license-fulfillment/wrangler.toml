name = "license-fulfillment"
main = "src/index.ts"
compatibility_date = "2026-07-01"

# Durable order memory: idempotency (a redelivered webhook finds state 'sent'
# and returns without re-issuing) and the retry queue the cron drains.
# Created 2026-08-01 via `wrangler kv namespace create ORDERS`.
# Retain logs. Without this, console.error is visible ONLY in a live
# `wrangler tail`, so every alert this Worker raises — undelivered order,
# unmapped product, unmatched renewal, refund — vanishes at the moment it
# happens. The refund alert on 2026-08-03 was lost exactly this way.
[observability]
enabled = true

[[kv_namespaces]]
binding = "ORDERS"
id = "7c0ac7b21f5e4223b4c585f73c3408a2"

# Retries any order still awaiting delivery. The webhook acknowledges as soon
# as the order is recorded, so this is what actually guarantees delivery —
# see src/fulfill.ts for the backoff.
[triggers]
crons = ["*/5 * * * *"]

# 10 requests per IP per minute on /renew/verify. The endpoint degrades to
# OPEN when this binding is absent, so a misconfiguration can never take
# renewals down — see src/verify.ts.
[[unsafe.bindings]]
name = "VERIFY_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[vars]
# ⚠️ TEMPORARY — Resend's test sender, for sandbox testing only.
#
# mail.seal-shot.com is not verified in Resend yet (it has no DNS records at
# all), so sending from license@mail.seal-shot.com returns 403 and no license
# reaches the buyer. resend.dev works without verification but can ONLY deliver
# to the Resend account owner's address — so a sandbox test purchase must use
# that email, and any other buyer would silently get nothing.
#
# Restore this line the moment mail.seal-shot.com verifies, and before any real
# sale. It is a launch blocker, tracked in docs/launch-checklist.md Phase 3.
#   EMAIL_FROM = "Sealshot <license@mail.seal-shot.com>"
EMAIL_FROM = "Sealshot <onboarding@resend.dev>"
# Polar product id -> license terms, read from `data.product_id` on order.paid.
# Adding a product is a config change, not a deploy. An unmapped id falls back
# to a 12-month NEW purchase: the buyer paid, so they get a working license,
# and `new` mints a fresh one rather than rewriting an existing window.
#
# ⚠️ These are SANDBOX product ids. At launch they must be replaced with the
# production ones, in the same change as the checkout URLs and
# CHECKOUT_IS_SANDBOX in src/config/promos.ts. Leaving sandbox ids here means
# every real purchase falls back to 12 months — so a founding buyer silently
# loses 6 months, and a renewal mints a SECOND license instead of extending
# the first. Nothing fails loudly; see the unmapped-product alert in Task 12.
#
#   e8d2217b… Sealshot            new,     12 months — $29.99
#   d5a0e9c3… Sealshot Founding   new,     18 months — $14.99
#   877dd2e8… Sealshot Renewal    renewal, 12 months — $17.99
#
# Those amounts are what these sandbox products actually charge AND what
# src/config/promos.ts advertises — verified 2026-08-16. The two can drift, since
# Polar decides the charge and neither this file nor the site does, so check it
# rather than believe this comment: `npm run check:prices` in the site repo reads
# each checkout link back from Polar. The production products, when they exist,
# have to be created at these amounts and checked the same way.
PRODUCT_MAP = '{"e8d2217b-25bc-45d0-8f7e-e0783a8d3762":{"kind":"new","months":12},"d5a0e9c3-a6c8-48ab-8010-932b8b1395d8":{"kind":"new","months":18},"877dd2e8-4edc-408c-99b0-d9919eccf6cd":{"kind":"renewal","months":12}}'
# The From subdomain is send-only, so replies need somewhere real to land.
REPLY_TO = "support@seal-shot.com"
# Where fulfilment alerts are emailed. Must be an address the current EMAIL_FROM
# can actually reach: while that is Resend's test sender, the ONLY permitted
# recipient is the Resend account owner's address. Pointing this at
# support@seal-shot.com before mail.seal-shot.com verifies would make every alert
# fail silently — the same failure this setting exists to prevent.
#
# ⚠️ Change to support@seal-shot.com in the same edit that restores EMAIL_FROM.
ALERT_EMAIL = "ray.deng83@gmail.com"
# Secrets (SIGNING_KEY_B64, POLAR_WEBHOOK_SECRET, RESEND_API_KEY) set via `wrangler secret put`
